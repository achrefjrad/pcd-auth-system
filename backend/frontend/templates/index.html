<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureAuth | Advanced Authentication</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#0a0a0a',
            foreground: '#f2f2f2',
            card: '#1c1c1c',
            cardForeground: '#f2f2f2',
            primary: '#2dd4bf',
            primaryForeground: '#0a0a0a',
            secondary: '#262626',
            secondaryForeground: '#f2f2f2',
            muted: '#262626',
            mutedForeground: '#999999',
            accent: '#2dd4bf',
            accentForeground: '#0a0a0a',
            destructive: '#ef4444',
            destructiveForeground: '#f2f2f2',
            success: '#2dd4bf',
            successForeground: '#0a0a0a',
            border: '#333333',
            input: '#1c1c1c',
            ring: '#2dd4bf',
          }
        }
      }
    }
  </script>
  <!-- External CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen bg-background flex items-center justify-center px-4 sm:px-20">
  <div class="absolute inset-0 bg-[linear-gradient(to_right,rgb(255_255_255_/_0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgb(255_255_255_/_0.03)_1px,transparent_1px)] bg-[size:60px_60px]"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-[480px] border border-border/50 bg-card/80 backdrop-blur-sm shadow-2xl rounded-xl">
    <div class="text-center space-y-4 pb-8 pt-10 px-8">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-primary/10 border border-primary/20 flex items-center justify-center mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">
          SecureAuth
        </h1>
        <p class="text-muted-foreground mt-2">
          Advanced authentication with biometric security
        </p>
      </div>
    </div>
    
    <div class="space-y-4 pb-8 px-8">
      <a href="{{ url_for('login_page') }}" class="block">
        <button class="w-full h-12 text-base font-medium bg-primary hover:bg-primary/90 text-primary-foreground transition-all duration-200 hover:shadow-lg hover:shadow-primary/20 rounded-lg cursor-pointer">
          <span class="inline-flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Login
          </span>
        </button>
      </a>
      
      <a href="{{ url_for('register_page') }}" class="block">
        <button class="w-full h-12 text-base font-medium border border-border hover:bg-secondary hover:border-primary/50 text-foreground transition-all duration-200 rounded-lg cursor-pointer">
          <span class="inline-flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            Sign Up
          </span>
        </button>
      </a>
      
      <div class="pt-6 flex items-center justify-center gap-4 sm:gap-8 text-sm text-muted-foreground flex-wrap">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
          <span>Secure Encryption</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-success animate-pulse"></div>
          <span>Biometric Verification</span>
        </div>
      </div>
    </div>
  </div>
  <!-- External JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
