<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | SecureAuth</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#0a0a0a',
            foreground: '#f2f2f2',
            card: '#1c1c1c',
            cardForeground: '#f2f2f2',
            primary: '#2dd4bf',
            primaryForeground: '#0a0a0a',
            secondary: '#262626',
            secondaryForeground: '#f2f2f2',
            muted: '#262626',
            mutedForeground: '#999999',
            accent: '#2dd4bf',
            accentForeground: '#0a0a0a',
            destructive: '#ef4444',
            destructiveForeground: '#f2f2f2',
            success: '#2dd4bf',
            successForeground: '#0a0a0a',
            border: '#333333',
            input: '#1c1c1c',
            ring: '#2dd4bf',
          }
        }
      }
    }
  </script>
  <!-- External CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen bg-background flex items-center justify-center px-4 sm:px-20">
  <div class="absolute inset-0 bg-[linear-gradient(to_right,rgb(255_255_255_/_0.03)_1px,transparent_1px),linear_gradient(to_bottom,rgb(255_255_255_/_0.03)_1px,transparent_1px)] bg-[size:60px_60px]"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-[480px] border border-border/50 bg-card/80 backdrop-blur-sm shadow-2xl rounded-xl">
    <div class="space-y-4 p-8">
      <a href="{{ url_for('login_page') }}" class="inline-flex items-center text-sm text-muted-foreground hover:text-foreground transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Login
      </a>
      
      <div class="text-center pt-2">
        <div class="mx-auto w-14 h-14 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3 3L9.5 15.5"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">
          Forgot Password
        </h1>
        <p class="text-muted-foreground mt-1">
          Enter your email to reset your password
        </p>
      </div>
    </div>
    
    <div class="px-8 pb-8">
      <form id="forgotPasswordForm" class="space-y-5">
        <div id="errorMessage" class="hidden p-3 rounded-lg bg-destructive/10 border border-destructive text-destructive text-sm text-center"></div>
        <div id="successMessage" class="hidden p-3 rounded-lg bg-success/10 border border-success text-success text-sm text-center"></div>
        
        <!-- Email -->
        <div class="space-y-2">
          <label for="email" class="text-foreground text-sm">Email Address</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your registered email"
              required
              class="pl-10 h-11 w-full bg-input border border-border focus:border-primary focus:ring-2 focus:ring-primary/20 text-foreground placeholder:text-muted-foreground rounded-lg px-3"
            />
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full h-12 text-base font-medium bg-primary hover:bg-primary/90 text-primary-foreground transition-all duration-200 hover:shadow-lg hover:shadow-primary/20 rounded-lg cursor-pointer"
        >
          Send Reset OTP
        </button>

        <p class="text-center text-sm text-muted-foreground">
          Remember your password? 
          <a href="{{ url_for('login_page') }}" class="text-primary hover:underline font-medium">Sign in</a>
        </p>
      </form>
    </div>
  </div>
  <!-- External JS -->
  <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
