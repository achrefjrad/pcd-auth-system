<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP | SecureAuth</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#0a0a0a',
            foreground: '#f2f2f2',
            card: '#1c1c1c',
            cardForeground: '#f2f2f2',
            primary: '#2dd4bf',
            primaryForeground: '#0a0a0a',
            secondary: '#262626',
            secondaryForeground: '#f2f2f2',
            muted: '#262626',
            mutedForeground: '#999999',
            accent: '#2dd4bf',
            accentForeground: '#0a0a0a',
            destructive: '#ef4444',
            destructiveForeground: '#f2f2f2',
            success: '#2dd4bf',
            successForeground: '#0a0a0a',
            border: '#333333',
            input: '#1c1c1c',
            ring: '#2dd4bf',
          }
        }
      }
    }
  </script>
  <!-- External CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen bg-background flex items-center justify-center px-4 sm:px-20 py-12">
  <div class="absolute inset-0 bg-[linear-gradient(to_right,rgb(255_255_255_/_0.03)_1px,transparent_1px),linear_gradient(to_bottom,rgb(255_255_255_/_0.03)_1px,transparent_1px)] bg-[size:60px_60px]"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-[480px] border border-border/50 bg-card/80 backdrop-blur-sm shadow-2xl rounded-xl">
    <div class="space-y-4 p-8">
      <a href="{{ url_for('login_page') }}" class="inline-flex items-center text-sm text-muted-foreground hover:text-foreground transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Login
      </a>
      
      <div class="text-center pt-2">
        <div class="mx-auto w-14 h-14 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">
          Verify OTP
        </h1>
        <p class="text-muted-foreground mt-1">
          A verification code has been sent to your email.
        </p>
      </div>
    </div>
    
    <div class="px-8 pb-8">
      <div id="errorMessage" class="hidden p-3 rounded-lg bg-destructive/10 border border-destructive text-destructive text-sm text-center mb-4"></div>
      <div id="successMessage" class="hidden p-3 rounded-lg bg-success/10 border border-success text-success text-sm text-center mb-4"></div>

      <!-- Email sent info -->
      <div class="text-center mb-6 p-4 bg-primary/10 rounded-lg border border-primary/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 mx-auto text-primary mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <p class="text-sm text-foreground">
          Check your email for the OTP code
        </p>
        <p class="text-xs text-muted-foreground mt-1">
          Also check your spam folder
        </p>
      </div>

      <form id="otpForm" class="space-y-4">
        <!-- OTP Input -->
        <div class="space-y-2">
          <label for="otp" class="text-foreground text-sm">Enter OTP Code</label>
          <input
            id="otp"
            name="otp"
            type="text"
            placeholder="Enter 6-digit OTP"
            required
            maxlength="6"
            class="h-11 w-full bg-input border border-border focus:border-primary focus:ring-2 focus:ring-primary/20 text-foreground placeholder:text-muted-foreground rounded-lg px-3 text-center text-lg tracking-widest"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full h-12 text-base font-medium bg-primary hover:bg-primary/90 text-primary-foreground transition-all duration-200 hover:shadow-lg hover:shadow-primary/20 rounded-lg cursor-pointer"
        >
          Verify OTP
        </button>
      </form>
    </div>
  </div>
  <!-- External JS -->
  <script src="{{ url_for('static', filename='js/otp.js') }}"></script>
</body>
</html>
