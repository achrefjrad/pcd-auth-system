<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SecureAuth</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#0a0a0a',
            foreground: '#f2f2f2',
            card: '#1c1c1c',
            cardForeground: '#f2f2f2',
            primary: '#2dd4bf',
            primaryForeground: '#0a0a0a',
            secondary: '#262626',
            secondaryForeground: '#f2f2f2',
            muted: '#262626',
            mutedForeground: '#999999',
            accent: '#2dd4bf',
            accentForeground: '#0a0a0a',
            destructive: '#ef4444',
            destructiveForeground: '#f2f2f2',
            success: '#2dd4bf',
            successForeground: '#0a0a0a',
            border: '#333333',
            input: '#1c1c1c',
            ring: '#2dd4bf',
          }
        }
      }
    }
  </script>
  <!-- External CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen bg-background flex items-center justify-center px-4 sm:px-20">
  <div class="absolute inset-0 bg-[linear-gradient(to_right,rgb(255_255_255_/_0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgb(255_255_255_/_0.03)_1px,transparent_1px)] bg-[size:60px_60px]"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-[480px] border border-border/50 bg-card/80 backdrop-blur-sm shadow-2xl rounded-xl">
    <div class="space-y-4 p-8">
      <a href="{{ url_for('home') }}" class="inline-flex items-center text-sm text-muted-foreground hover:text-foreground transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </a>
      
      <div class="text-center pt-2">
        <div class="mx-auto w-14 h-14 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-foreground">
          Welcome Back
        </h1>
        <p class="text-muted-foreground mt-1">
          Sign in to your secure account
        </p>
      </div>
    </div>
    
    <div class="px-8 pb-8">
      <form id="loginForm" class="space-y-5">
        <div id="errorMessage" class="hidden p-3 rounded-lg bg-destructive/10 border border-destructive text-destructive text-sm text-center"></div>
        
        <!-- Username -->
        <div class="space-y-2">
          <label for="username" class="text-foreground text-sm">Username</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Enter your username"
              required
              class="pl-10 h-11 w-full bg-input border border-border focus:border-primary focus:ring-2 focus:ring-primary/20 text-foreground placeholder:text-muted-foreground rounded-lg px-3"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="text-foreground text-sm">Password</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              required
              class="pl-10 pr-10 h-11 w-full bg-input border border-border focus:border-primary focus:ring-2 focus:ring-primary/20 text-foreground placeholder:text-muted-foreground rounded-lg px-3"
            />
            <button
              type="button"
              onclick="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors"
            >
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Biometric Image Upload -->
        <div class="space-y-2">
          <label class="text-foreground text-sm">Biometric Authentication</label>
          <div
            id="imageUpload"
            class="relative border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-all duration-200 border-border hover:border-primary/50 hover:bg-secondary/50"
            onclick="document.getElementById('image').click()"
          >
            <input
              type="file"
              id="image"
              name="image"
              accept="image/*"
              required
              class="hidden"
              onchange="handleImageSelect(this)"
            />
            
            <div id="imagePreview">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 mx-auto text-muted-foreground mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <p class="text-sm text-foreground font-medium">
                Drop your image here or click to browse
              </p>
              <p class="text-xs text-muted-foreground mt-1">
                PNG, JPG up to 10MB
              </p>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full h-12 text-base font-medium bg-primary hover:bg-primary/90 text-primary-foreground transition-all duration-200 hover:shadow-lg hover:shadow-primary/20 rounded-lg cursor-pointer"
        >
          Login
        </button>

        <p class="text-center text-sm text-muted-foreground">
          Don't have an account? 
          <a href="{{ url_for('register_page') }}" class="text-primary hover:underline font-medium">Sign up</a>
        </p>
      </form>
    </div>
  </div>
  <!-- External JS -->
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
